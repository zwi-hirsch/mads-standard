name: Verify MADS exact release candidate
on:
  pull_request:
    paths:
      - 'MULTI-AGENT-DEVELOPMENT-SYSTEM.md'
      - 'scripts/**'
      - 'MADS-VERSION.yaml'
      - 'README.md'
      - 'PUBLISHING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'templates/mads/v2/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zwi-hirsch/mads-standard'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Execute reference negative tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build and bind exact candidate
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/mads-candidate"
          if grep -q "^publication_status: STAGED_NOT_PUBLISHED" MADS-VERSION.yaml; then
            python3 scripts/build_release.py --draft --out "$OUT"
            DRAFT=--draft
          else
            python3 scripts/build_release.py --out "$OUT"
            DRAFT=
          fi
          (cd "$OUT" && sha256sum -c *.zip.sha256)
          python3 scripts/check_release.py --archive "$OUT"/*.zip --anchor-out "$OUT/candidate.trust.json" $DRAFT
