name: Publish MADS Standard v2.x
on:
  push:
    branches: [main]
    paths:
      - 'MADS-VERSION.yaml'
      - '.github/workflows/release-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mads-v2-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'zwi-hirsch/mads-standard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and package approved release source
        id: package
        run: |
          set -euo pipefail
          grep -Eq '^publication_status: (RELEASE_READY|RELEASED)$' MADS-VERSION.yaml
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/build_release.py --out "$RUNNER_TEMP/mads-build"
          VERSION=$(sed -n 's/^version: "\([0-9.]*\)"$/\1/p' MADS-VERSION.yaml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ZIP="mads-standard-v$VERSION.zip"
          (cd "$RUNNER_TEMP/mads-build" && sha256sum -c "$ZIP.sha256")
          python3 scripts/check_release.py --archive "$RUNNER_TEMP/mads-build/$ZIP" --anchor-out "$RUNNER_TEMP/mads-build/$ZIP.trust.json"
      - name: Publish exact immutable tag and release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          ZIP="mads-standard-$TAG.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release must be verified, never overwritten"
          else
            gh release create "$TAG" "$RUNNER_TEMP/mads-build/$ZIP" "$RUNNER_TEMP/mads-build/$ZIP.sha256" "$RUNNER_TEMP/mads-build/$ZIP.trust.json" --target "$GITHUB_SHA" --title "MADS Standard $TAG" --notes "Git-native MADS. Independently verify the release trust manifest and approve its SHA-256 outside agent-writable refs before adoption. Apache-2.0." --latest
          fi
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets
          test "$(git ls-remote https://github.com/zwi-hirsch/mads-standard.git "refs/tags/$TAG" | cut -f1)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/mads-public"
          cd "$RUNNER_TEMP/mads-public"
          curl -fsSL "https://github.com/zwi-hirsch/mads-standard/releases/download/$TAG/$ZIP" -o "$ZIP"
          curl -fsSL "https://github.com/zwi-hirsch/mads-standard/releases/download/$TAG/$ZIP.sha256" -o "$ZIP.sha256"
          sha256sum -c "$ZIP.sha256"
          cmp "$ZIP" "$RUNNER_TEMP/mads-build/$ZIP"
          curl -fsSL "https://github.com/zwi-hirsch/mads-standard/releases/download/$TAG/$ZIP.trust.json" -o "$ZIP.trust.json"
          cmp "$ZIP.trust.json" "$RUNNER_TEMP/mads-build/$ZIP.trust.json"
          sha256sum "$ZIP.trust.json"
          echo "PUBLIC_RELEASE_VERIFIED"
