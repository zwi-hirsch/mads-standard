name: Publish MADS Standard v2.x
on:
  push:
    branches: [main]
    paths:
      - 'MADS-VERSION.yaml'
      - '.github/workflows/release-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mads-v2-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'zwi-hirsch/mads-standard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and package approved release source
        id: package
        run: |
          set -euo pipefail
          grep -Eq '^publication_status: (RELEASE_READY|RELEASED)$' MADS-VERSION.yaml
          python3 -m py_compile scripts/build_release.py
          python3 scripts/build_release.py --out "$RUNNER_TEMP/mads-build"
          VERSION=$(python3 -c 'import runpy; print(runpy.run_path("scripts/build_release.py")["VERSION"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          (cd "$RUNNER_TEMP/mads-build" && sha256sum -c "mads-standard-v${VERSION}.zip.sha256")
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          paths = list((Path(os.environ["RUNNER_TEMP"])/"mads-build").glob("*.zip"))
          assert len(paths) == 1
          with zipfile.ZipFile(paths[0]) as z:
              assert z.testzip() is None
              prefix = z.namelist()[0].split("/")[0]+"/"
              m = json.loads(z.read(prefix+"RELEASE-MANIFEST.json"))
              assert m["draft"] is False
              for rel, expected in m["files_sha256"].items():
                  assert hashlib.sha256(z.read(prefix+rel)).hexdigest() == expected, rel
                  assert Path(rel).read_bytes() == z.read(prefix+rel), rel
          print("RELEASE_ZIP_INDEPENDENT_VERIFY_PASS")
          PY
      - name: Publish exact immutable tag and release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          ZIP="mads-standard-$TAG.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release must be verified, never overwritten"
          else
            gh release create "$TAG" "$RUNNER_TEMP/mads-build/$ZIP" "$RUNNER_TEMP/mads-build/$ZIP.sha256" --target "$GITHUB_SHA" --title "MADS Standard $TAG" --notes "Git-native MADS, normative Sections 1–31: immediate admission, Git-only handoff, abrupt context recovery, proactive blocker ownership and interrupted REPORT recovery. Apache-2.0." --latest
          fi
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets
          test "$(git ls-remote https://github.com/zwi-hirsch/mads-standard.git "refs/tags/$TAG" | cut -f1)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/mads-public"
          cd "$RUNNER_TEMP/mads-public"
          curl -fsSL "https://github.com/zwi-hirsch/mads-standard/releases/download/$TAG/$ZIP" -o "$ZIP"
          curl -fsSL "https://github.com/zwi-hirsch/mads-standard/releases/download/$TAG/$ZIP.sha256" -o "$ZIP.sha256"
          sha256sum -c "$ZIP.sha256"
          cmp "$ZIP" "$RUNNER_TEMP/mads-build/$ZIP"
          echo "PUBLIC_RELEASE_VERIFIED"
