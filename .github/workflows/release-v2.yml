name: Publish MADS Standard v2.x
on:
  push:
    branches: [main]
    paths:
      - 'MADS-VERSION.yaml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mads-v2-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'zwi-hirsch/mads-standard'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check executable release build
        run: |
          python3 -m py_compile scripts/build_release.py
          python3 scripts/build_release.py --out "$RUNNER_TEMP/mads-build"
          (cd "$RUNNER_TEMP/mads-build" && sha256sum -c mads-standard-v2.0.1.zip.sha256)
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          import os
          p=Path(os.environ["RUNNER_TEMP"])/"mads-build/mads-standard-v2.0.1.zip"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert len(z.namelist()) >= 18
              assert any(x.endswith("/LICENSE") for x in z.namelist())
          print("RELEASE_ZIP_INDEPENDENT_VERIFY_PASS")
          PY
      - name: Publish immutable tag and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.1 >/dev/null 2>&1; then
            echo "RELEASE_ALREADY_EXISTS: immutable v2.0.1 already published"
            exit 0
          fi
          gh release create v2.0.1 \
            "$RUNNER_TEMP/mads-build/mads-standard-v2.0.1.zip" \
            "$RUNNER_TEMP/mads-build/mads-standard-v2.0.1.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "MADS Standard v2.0.1" \
            --notes "Docs-only patch release with one-name autonomous project bootstrap; all 26 normative MADS v2.0 sections and Apache-2.0 retained. Exact source SHA plus ZIP SHA256 sidecar published." \
            --latest
          gh release view v2.0.1 --json tagName,isDraft,isPrerelease,url,assets
