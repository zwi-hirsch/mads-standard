name: Publish MADS Standard v2.x
on:
  push:
    branches: [main]
    paths:
      - 'MADS-VERSION.yaml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mads-v2-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'zwi-hirsch/mads-standard'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check executable release build
        run: |
          python3 -m py_compile scripts/build_release.py
          python3 scripts/build_release.py --out "$RUNNER_TEMP/mads-build"
          VERSION=$(python3 -c 'import runpy; print(runpy.run_path("scripts/build_release.py")["VERSION"])')
          (cd "$RUNNER_TEMP/mads-build" && sha256sum -c "mads-standard-v${VERSION}.zip.sha256")
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          import os
          import glob
          matches=glob.glob(os.environ["RUNNER_TEMP"]+"/mads-build/mads-standard-v*.zip")
          assert len(matches)==1,matches
          p=Path(matches[0])
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert len(z.namelist()) >= 18
              assert any(x.endswith("/LICENSE") for x in z.namelist())
          print("RELEASE_ZIP_INDEPENDENT_VERIFY_PASS")
          PY
      - name: Publish immutable tag and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import runpy; print(runpy.run_path("scripts/build_release.py")["VERSION"])')
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "RELEASE_ALREADY_EXISTS: immutable v${VERSION} already published"
            exit 0
          fi
          gh release create "v${VERSION}" \
            "$RUNNER_TEMP/mads-build/mads-standard-v${VERSION}.zip" \
            "$RUNNER_TEMP/mads-build/mads-standard-v${VERSION}.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "MADS Standard v${VERSION}" \
            --notes "MADS immediate source admission, Git-only artifact handoff and abrupt-context recovery: Sections 18, 27–29; unchanged secret/production boundaries and Apache-2.0." \
            --latest
          gh release view "v${VERSION}" --json tagName,isDraft,isPrerelease,url,assets
