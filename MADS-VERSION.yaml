schema: mads.release.v1
name: MULTI-AGENT DEVELOPMENT SYSTEM
version: "2.0.7"
normative_sections: 33
publication_status: STAGED_NOT_PUBLISHED
source_of_truth_after_release: mads-standard
canonical_branch: main
artifacts:
  - MULTI-AGENT-DEVELOPMENT-SYSTEM.md
  - templates/mads/v2/
  - scripts/successor_broker.py
  - scripts/test_successor_broker.py
  - scripts/mads_verify.py
  - scripts/test_mads_verify.py
  - scripts/check_release.py
  - scripts/build_release.py
integrity:
  release_trust_manifest: OWNER_APPROVED_OUT_OF_BAND_SHA256_REQUIRED
  release_sha256_manifest: VERIFY_RELEASE_ASSET_SHA256_AT_PUBLICATION
  git_commit_sha: RESOLVE_FROM_IMMUTABLE_RELEASE_TAG
  release_tag: v2.0.7
  release_url: null # set only after immutable release is published
  zip_sha256: VERIFY_RELEASE_ASSET_SHA256_AT_PUBLICATION
adoption:
  copy_into_each_project: true
  pin_version_and_artifact_sha256: true
  dependency_on_upstream_private_repo: false
secret_scopes:
  standard_public_read: NO_TOKEN_REQUIRED
  each_project_private_git: OWN_LEAST_PRIVILEGE_TOKEN_ONLY
